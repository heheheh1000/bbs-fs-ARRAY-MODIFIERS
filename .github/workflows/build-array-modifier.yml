name: Build BBS FS 2.7 (Array Modifier)

on:
  push:
    branches:
      - array-modifier-1.20.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: bash ./gradlew build --no-daemon

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bbs-fs-2.7-array-modifier
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
